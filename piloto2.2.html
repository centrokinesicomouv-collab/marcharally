function teacherRows(){const el=$('teacherRows');if(!el)return;const v=teacherSearch.toLowerCase();el.innerHTML=db.students.filter(s=>(s.name+' '+s.rut+' '+(db.teams.find(t=>t.id===s.teamId)?.name||'')).toLowerCase().includes(v)).map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(fmtRut(s.rut))}</small></td><td>${esc(db.teams.find(t=>t.id===s.teamId)?.name||'')}</td><td>${answerCount(s)}/${NQ}${s.finishedAt?'<br><small>Entregada</small>':''}</td><td><b>${scores(s).total}/${MAXPTS}</b><br><small>Nota ${fmtNota(notaChile(scores(s).total,MAXPTS))}</small></td><td>${exitCell(s)}</td><td><button class="linkbtn" onclick="selectedDetail='${esc(s.id)}';detailRender()">Revisar</button></td></tr>`).join('')||'<tr><td colspan="6">Sin estudiantes registrados.</td></tr>'}
function detailRender(){const s=db.students.find(x=>x.id===selectedDetail),el=$('teacherDetail');if(!el||!s)return;let h=`<div class="panel"><div class="topline"><div><div class="eyebrow">FICHA DE ESTUDIANTE</div><h2>${esc(s.name)}</h2><p>RUT ${esc(fmtRut(s.rut))} · ${esc(db.teams.find(t=>t.id===s.teamId)?.name||'')} · ${answerCount(s)}/${NQ} respuestas · <b>${scores(s).total}/${MAXPTS} pts · Nota ${fmtNota(notaChile(scores(s).total,MAXPTS))}</b></p></div><button class="btn secondary" onclick="selectedDetail='';teacherRender()">Cerrar</button></div>${MCMAX?'<h3>Alternativas</h3>':''}`;for(const q of QUESTIONS.mc){const a=s.answers?.[q.id];h+=`<div class="badgebox"><b>${esc(q.tag)}</b><p>${a?'Respuesta '+esc(a.choice.toUpperCase())+(a.choice===q.answer?' · Correcta (+1)':' · Incorrecta (+0)')+(a.changed?' · Cambió desde '+esc(String(a.first).toUpperCase()):''):'Sin responder'} · Clave: ${esc(q.answer.toUpperCase())}</p><p class="hint">${esc(q.rationale)}</p></div>`}h+='<h3>Desarrollos y rúbricas</h3>';for(const q of QUESTIONS.open){const a=s.answers?.[q.id];h+=`<div class="badgebox"><b>${esc(q.tag)}</b>${a?Object.entries(a.fields).map(([k,t])=>`<div class="meta">${esc(k.toUpperCase())}</div><div class="longtext">${esc(t)}</div>`).join(''):'<p>Sin entregar.</p>'}`;if(a){const evalx=a.evaluation,vals=s.overrides?.[q.id]?.scores||evalx.scores;h+=`<p class="meta">Revisión automática: ${evalx.total}/${evalx.max||10} · Vigente: ${vals.reduce((x,y)=>x+y,0)}/${evalx.max||10} → ${toPoints(q,vals.reduce((x,y)=>x+y,0))} pt</p><form data-grade="${q.id}">`;RUBRIC[q.id].forEach((r,i)=>h+=`<div class="criterium"><span>${esc(r.title)}<br><small>${esc(r.detail)}</small></span><select data-i="${i}">${Array.from({length:r.max+1},(_,j)=>`<option ${vals[i]===j?'selected':''} value="${j}">${j} / ${r.max}</option>`).join('')}</select></div>`);h+='<button class="btn secondary" style="margin:12px 0" type="submit">Guardar revisión docente</button></form>'}h+='</div>'}h+='<h3>Entradas y salidas</h3>';for(const e of (s.events||[]).slice().reverse()){h+=`<div class="event"><b>${e.kind==='salida'?'Salida':'Entrada'}</b><span>${tm(e.at)} · ${esc(e.reason)} ${e.kind==='salida'?`<label style="display:inline;margin-left:12px"><input type="checkbox" style="width:auto" data-waive="${e.id}" ${e.waived?'checked':''}> Anular −1</label>`:''}</span></div>`}h+='</div>';el.innerHTML=h;el.querySelectorAll('[data-grade]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const qid=f.dataset.grade;s.overrides={...(s.overrides||{}),[qid]:{scores:[...f.querySelectorAll('[data-i]')].map(x=>Number(x.value)),at:new Date().toISOString()}};if(await saveStudent(s,['overrides'])){document.activeElement?.blur();teacherRender();selectedDetail=s.id;detailRender();notice('Rúbrica revisada.',true)}});el.querySelectorAll('[data-waive]').forEach(x=>x.onchange=async()=>{const e=(s.events||[]).find(v=>v.id===x.dataset.waive);if(!e)return;e.waived=x.checked;await saveStudent(s,['events']);teacherRender();selectedDetail=s.id;detailRender()})}
function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>notice('La pantalla completa no está disponible en este navegador.'))}}
function createRoom(){if(db.students.length&&!confirm('Vas a crear una sala nueva. La sala actual ('+roomCode+') y sus resultados se conservan en la base de datos; puedes volver con su código y PIN. ¿Continuar?'))return;teacher=null;safeSessionRemove(TSESSION);selectedDetail='';setRoom('');}
async function teacherPhase(ph){try{const {error}=await sb.rpc('set_room_phase',{p_code:roomCode,p_hash:teacher.hash,p_phase:ph});if(error)throw error;await refresh(true)}catch(e){notice(friendly(e))}}
function startRoom(){if(phase()!=='lobby'||!db.students.length)return;if(!confirm('Iniciar el plazo único de 60 minutos para toda la sala. ¿Continuar?'))return;teacherPhase('active')}
function closeRoom(){if(!confirm('Cerrar definitivamente esta evaluación para todos los estudiantes?'))return;teacherPhase('closed')}
function exportCSV(){const rows=[['Nombre','RUT','Modalidad','Inicio','Respuestas','Alternativas y pareados/'+MCMAX,'Desarrollo/'+OPMAX,'Penalizaciones','Total/'+MAXPTS,'Nota','Eventos','Respuestas desarrollo']];for(const s of db.students){const sc=scores(s);rows.push([s.name,s.rut,db.teams.find(t=>t.id===s.teamId)?.name||'',s.joinedAt,answerCount(s),sc.mc,sc.op,sc.penalties,sc.total,fmtNota(notaChile(sc.total,MAXPTS)),(s.events||[]).map(e=>`${e.at} ${e.kind} ${e.reason}${e.waived?' [anulada]':''}`).join(' | '),QUESTIONS.open.map(q=>JSON.stringify(s.answers[q.id]?.fields||{})).join(' | ')])}const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Ev3000_Piloto22_'+roomCode+'_Resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}
document.addEventListener('visibilitychange',()=>{if(view==='student'){if(document.hidden)event('salida','Pestaña oculta / cambio de aplicación');else{event('entrada','Regreso a la pestaña');refresh(false)}}});
window.addEventListener('pagehide',()=>{if(view==='student')event('salida','Navegación o cierre del navegador')});
let wasFull=false;document.addEventListener('fullscreenchange',()=>{if(view==='student'&&wasFull&&!document.fullscreenElement)event('salida','Salida de pantalla completa');wasFull=!!document.fullscreenElement});
setInterval(()=>{const c=clockString();for(const id of ['clockStudent','clockWall','clockTeacher']){const el=$(id);if(el)el.textContent=c}if(view==='student'&&getMe()&&phase()==='closed')studentRender(false)},1000);
setInterval(()=>{if(document.hidden)return;refresh(false)},view==='student'?12000:8000);
// Enlaces directos: ?sala=CODIGO, #docente, #qr
(async()=>{if(!sb){netError='No se pudo cargar la conexión a la base de datos. Revisa tu internet y recarga la página.'}else{syncClock();subscribe()}if(location.hash==='#docente'){view='student';goto('teacher')}else if(location.hash==='#qr'){view='student';goto('wall')}else render(true);await refresh(true)})();
</script></body></html>
