os pies. Camina sola en piso liso y bien iluminado, pero pierde estabilidad en veredas irregulares y depende de mirar sus pies al sortear desniveles. Quiere retomar desplazamientos breves al almacén del barrio; no presenta debilidad proximal relevante.","task":"¿Qué objetivo específico sería más pertinente para esta situación?","options":[{"id":"a","text":"Incrementar la fuerza proximal de cadera para estabilizar la pelvis y aumentar la longitud del paso en superficies uniformes."},{"id":"b","text":"Disminuir la dependencia de apoyos externos para restablecer la marcha autónoma sin ayudas en todas las superficies."},{"id":"c","text":"Mejorar el equilibrio funcional y el uso de apoyos seguros para negociar desniveles y facilitar trayectos comunitarios."},{"id":"d","text":"Optimizar el ritmo de marcha en terreno plano para completar trayectos comunitarios con mayor velocidad y continuidad."}],"answer":"c","rationale":"La restricción ocurre al afrontar desniveles con déficit sensitivo; la meta funcional es gestionar ese entorno con seguridad, no retirar ayudas ni aumentar velocidad prematuramente."},{"id":"c05","tag":"Cerebelosa • desequilibrio lateral","case":"Paciente de 45 años con ataxia cerebelosa de curso estable. Presenta base de sustentación amplia, oscilaciones mediolaterales e irregularidad de pasos, con dificultad para cambiar de dirección dentro de su domicilio. La sensibilidad de posición está preservada y mirar el suelo no corrige la inestabilidad. Ha tropezado dos veces este mes.","task":"¿Cuál objetivo específico es clínicamente más pertinente?","options":[{"id":"a","text":"Incrementar la integración de señales propioceptivas para reducir la dependencia visual y sostener giros en espacios cerrados."},{"id":"b","text":"Aumentar la velocidad de desplazamiento para completar los giros domiciliarios antes de que aparezca fatiga muscular."},{"id":"c","text":"Normalizar el ancho de la base de apoyo para alcanzar un patrón estético simétrico durante la marcha function updateTeamSelect(){const sel=$('teamSelect');if(!sel)return;const cur=sel.value;const counts={};for(const s of db.students)counts[s.teamId]=(counts[s.teamId]||0)+1;const opts='<option value="">Seleccionar equipo</option>'+db.teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');if(sel.dataset.sig!==opts){sel.innerHTML=opts;sel.dataset.sig=opts;sel.value=db.teams.some(t=>t.id===cur)?cur:''}const btn=$('regBtn');if(btn&&!btn.disabled)btn.textContent=phase()==='lobby'?'Ingresar al aula':'Retomar mi sesión'}
function joinUrl(){return location.origin+location.pathname+'?sala='+encodeURIComponent(roomCode)}
function wallRender(){const p=phase();if(!roomCode||!db.room){$('wallBody').innerHTML=`${netBanner()}<div class="panel center" style="max-width:620px;margin:30px auto"><h2>No hay una sala abierta</h2><p>El docente debe crear o abrir una sala en la pestaña <b>Docente</b>. Luego esta pantalla mostrará el QR de ingreso.</p><button class="btn" onclick="goto('teacher')">Ir a Docente</button></div>`;return}$('wallBody').innerHTML=`${netBanner()}<div class="eyebrow">PANTALLA PARA PROYECTAR EN EL AULA</div><h1>Conéctate a MarchaRally</h1><div class="split"><div class="panel center"><h2>Acceso mediante QR</h2><div id="qrBox" class="qrcode"></div><p style="font-size:15px">Código de sala: <b style="font-size:30px;letter-spacing:.15em">${esc(roomCode)}</b></p><div id="urlPrint" class="linkline"></div><div class="row" style="justify-content:center;margin-top:15px"><button class="btn secondary" onclick="copyLink()">Copiar enlace</button><button class="btn secondary" onclick="print()">Imprimir QR</button></div></div><div class="panel"><div class="eyebrow">ESTADO DEL AULA · ${esc(db.room.name)}</div><h2>${p==='lobby'?'Inscripción abierta':p==='active'?'Evaluación en curso':'Evaluación finalizada'}</h2><div class="timer" id="clockWall">${clockString()}</div><p>${db.students.length} estudiantes inscritos · ${db.teams.length} equipos</p><h2>Marcador de equipos</h2>${boardHtml()}<p class="hint" style="margin-top:18px">${EVIDENCE}</p></div></div>`;const box=$('qrBox');try{const url=joinUrl();const qr=new QRCode(0,QRModules.QRErrorCorrectLevel.M);qr.addData(url);qr.make();const m=qr.getModuleCount(),rects=[];for(let r=0;r<m;r++)for(let c=0;c<m;c++)if(qr.isDark(r,c))rects.push(`<rect x="${c}" y="${r}" width="1" height="1"/>`);box.innerHTML=`<svg role="img" aria-label="Código QR para abrir MarchaRally" viewBox="-3 -3 ${m+6} ${m+6}" xmlns="http://www.w3.org/2000/svg"><rect x="-3" y="-3" width="${m+6}" height="${m+6}" fill="white"/><g fill="#102f38">${rects.join('')}</g></svg>`;$('urlPrint').textContent=url}catch(e){box.textContent='No se pudo generar el QR: '+e.message}}
function copyLink(){if(!roomCode)return notice('Primero crea o abre una sala.');navigator.clipboard?.writeText(joinUrl()).then(()=>notice('Enlace copiado.')).catch(()=>notice('Copia el enlace que aparece debajo del QR.'))}
function teacherLoginHtml(){return `${netBanner()}<div class="split" style="max-width:900px;margin:30px auto"><div class="panel"><div class="eyebrow">NUEVA SALA</div><h2>Crear sala</h2><p>Se generará un código de 6 caracteres para tus estudiantes.</p><form id="createForm"><label>Nombre de la sala<input name="name" maxlength="80" value="MarchaRally · Marchas neurológicas"></label><label>PIN docente (mínimo 6 caracteres)<input name="pin" type="password" required minlength="6" autocomplete="new-password"></label><label>Confirmar PIN<input name="confirm" type="password" required minlength="6" autocomplete="new-password"></label><label style="font-weight:500"><input type="checkbox" name="auto" style="width:auto"> Demostración individual: el reloj parte al primer registro</label><button class="btn big" id="createBtn">Crear sala</button></form></div><div class="panel"><div class="eyebrow">SALA EXISTENTE</div><h2>Abrir sala</h2><p>Para volver a una sala que ya creaste (por ejemplo, desde otro computador).</p><form id="openForm"><label>Código de sala<input name="code" maxlength="6" required value="${esc(roomCode)}" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label><label>PIN docente<input name="pin" type="password" required minlength="6" autocomplete="current-password"></label><button class="btn big" id="openBtn">Abrir sala</button></form></div></div>`}
function teacherRender(){if(!teacher||teacher.code!==roomCode||!db.room){if(teacher&&loadedOnce&&roomCode===teacher.code&&!db.room&&!netError){teacher=null;safeSessionRemove(TSESSION)}if($('createForm')&&$('teacherBody').contains(document.activeElement))return;$('teacherBody').innerHTML=teacherLoginHtml();
 $('createForm').onsubmit=async e=>{e.preventDefault();const f=e.target,pin=f.elements.pin.value;if(pin.length<6||pin!==f.elements.confirm.value)return notice('PIN no coincide o demasiado corto.');const btn=$('createBtn');btn.disabled=true;btn.textContent='Creando…';try{const hash=pinHash(pin);const {data,error}=await sb.rpc('create_room',{p_name:f.elements.name.value.trim(),p_hash:hash,p_auto:f.elements.auto.checked});if(error)throw error;const r=Array.isArray(data)?data[0]:data;teacher={code:r.code,hash};safeSessionSet(TSESSION,JSON.stringify(teacher));selectedDetail='';await setRoom(r.code);notice('Sala '+r.code+' creada. Proyecta el QR para que se inscriban.')}catch(err){notice(friendly(err));btn.disabled=false;btn.textContent='Crear sala'}};
 $('openForm').onsubmit=async e=>{e.preventDefault();const f=e.target,code=normCode(f.elements.code.value),hash=pinHash(f.elements.pin.value);const btn=$('openBtn');btn.disabled=true;try{const {data,error}=await sb.rpc('teacher_check',{p_code:code,p_hash:hash});if(error)throw error;if(!data)throw new Error('Código o PIN incorrecto.');teacher={code,hash};safeSessionSet(TSESSION,JSON.stringify(teacher));selectedDetail='';await setRoom(code)}catch(err){notice(friendly(err));btn.disabled=false}};return}
if($('teacherBody').querySelector('[data-grade]')&&$('teacherBody').contains(document.activeElement)&&document.activeElement.closest('[data-grade]'))return;
const searchFocused=document.activeElement?.id==='teacherSearch';if(searchFocused)return teacherRows();
const p=phase(),students=db.students;
$('teacherBody').innerHTML=`${netBanner()}<div class="topline"><div><div class="eyebrow">GESTIÓN DE AULA · SINCRONIZADA</div><h1>Panel docente</h1><p class="meta">${esc(db.room.name)} · Sala <b>${esc(roomCode)}</b> · ${p==='lobby'?'Inscripción':p==='active'?'En curso':'Cerrada'}</p></div><div><div class="meta">TIEMPO GLOBAL</div><div class="timer" id="clockTeacher">${clockString()}</div></div></div><div class="panel"><div class="row"><button class="btn secondary" onclick="createRoom()">Nueva sala</button><button class="btn" ${p==='lobby'&&students.length?'':'disabled'} onclick="startRoom()">Iniciar 60 minutos</button><button class="btn warning" ${p==='active'?'':'disabled'} onclick="closeRoom()">Finalizar prueba</button><button class="btn secondary" onclick="goto('wall')">Proyectar QR</button><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button><button class="btn secondary" onclick="teacher=null;safeSessionRemove(TSESSION);teacherRender()">Salir</button></div></div><div class="notice" style="margin-bottom:20px">${EVIDENCE}</div><div class="stats"><div><small>Inscritos</small><strong>${students.length}</strong></div><div><small>Equipos</small><strong>${db.teams.length}</strong></div><div><small>Respuestas</small><strong>${students.reduce((a,s)=>a+answerCount(s),0)}</strong></div><div><small>Salidas no anuladas</small><strong>${students.reduce((a,s)=>a+scores(s).penalties,0)}</strong></div></div><div class="split"><div class="panel"><div class="topline"><h2>Resultados por estudiante</h2><input id="teacherSearch" placeholder="Buscar estudiante o equipo" style="max-width:240px" value="${esc(teacherSearch)}" oninput="teacherSearch=this.value;teacherRows()"></div><div class="scroll"><table><thead><tr><th>Estudiante / RUT</th><th>Equipo</th><th>Progreso</th><th>Puntos</th><th>Salidas</th><th>Detalle</th></tr></thead><tbody id="teacherRows"></tbody></table></div></div><div class="panel"><h2>Tabla de equipos</h2>${boardHtml()}<p class="hint" style="margin-top:20px">Clasificación por promedio individual, no por suma de integrantes.</p></div></div><div id="teacherDetail"></div>`;teacherRows();if(selectedDetail)detailRender()}
function teacherRows(){const el=$('teacherRows');if(!el)return;const v=teacherSearch.toLowerCase();el.innerHTML=db.students.filter(s=>(s.name+' '+s.rut+' '+(db.teams.find(t=>t.id===s.teamId)?.name||'')).toLowerCase().includes(v)).map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.rut)}</small></td><td>${esc(db.teams.find(t=>t.id===s.teamId)?.name||'')}</td><td>${answerCount(s)}/12</td><td><b>${scores(s).total}/50</b></td><td>${scores(s).penalties}</td><td><button class="linkbtn" onclick="selectedDetail='${esc(s.id)}';detailRender()">Revisar</button></td></tr>`).join('')||'<tr><td colspan="6">Sin estudiantes registrados.</td></tr>'}
function detailRender(){const s=db.students.find(x=>x.id===selectedDetail),el=$('teacherDetail');if(!el||!s)return;let h=`<div class="panel"><div class="topline"><div><div class="eyebrow">FICHA DE ESTUDIANTE</div><h2>${esc(s.name)}</h2><p>RUT ${esc(s.rut)} · ${esc(db.teams.find(t=>t.id===s.teamId)?.name||'')} · ${answerCount(s)}/12 respuestas · <b>${scores(s).total}/50 pts</b></p></div><button class="btn secondary" onclick="selectedDetail='';teacherRender()">Cerrar</button></div><h3>Alternativas</h3>`;for(const q of QUESTIONS.mc){const a=s.answers?.[q.id];h+=`<div class="badgebox"><b>${esc(q.tag)}</b><p>${a?'Respuesta '+esc(a.choice.toUpperCase())+(a.choice===q.answer?' · Correcta (+3)':' · Incorrecta (+0)'):'Sin responder'} · Clave: ${esc(q.answer.toUpperCase())}</p><p class="hint">${esc(q.rationale)}</p></div>`}h+='<h3>Desarrollos y rúbricas</h3>';for(const q of QUESTIONS.open){const a=s.answers?.[q.id];h+=`<div class="badgebox"><b>${esc(q.tag)}</b>${a?Object.entries(a.fields).map(([k,t])=>`<div class="meta">${esc(k.toUpperCase())}</div><div class="longtext">${esc(t)}</div>`).join(''):'<p>Sin entregar.</p>'}`;if(a){const evalx=a.evaluation,vals=s.overrides?.[q.id]?.scores||evalx.scores;h+=`<p class="meta">Autoevaluación: ${evalx.total}/10 · Calificación vigente: ${vals.reduce((x,y)=>x+y,0)}/10</p><form data-grade="${q.id}">`;RUBRIC[q.id].forEach((r,i)=>h+=`<div class="criterium"><span>${esc(r.title)}<br><small>${esc(r.detail)}</small></span><select data-i="${i}">${Array.from({length:r.max+1},(_,j)=>`<option ${vals[i]===j?'selected':''} value="${j}">${j} / ${r.max}</option>`).join('')}</select></div>`);h+='<button class="btn secondary" style="margin:12px 0" type="submit">Guardar revisión docente</button></form>'}h+='</div>'}h+='<h3>Entradas y salidas</h3>';for(const e of (s.events||[]).slice().reverse()){h+=`<div class="event"><b>${e.kind==='salida'?'Salida':'Entrada'}</b><span>${tm(e.at)} · ${esc(e.reason)} ${e.kind==='salida'?`<label style="display:inline;margin-left:12px"><input type="checkbox" style="width:auto" data-waive="${e.id}" ${e.waived?'checked':''}> Anular −1</label>`:''}</span></div>`}h+='</div>';el.innerHTML=h;el.querySelectorAll('[data-grade]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const qid=f.dataset.grade;s.overrides={...(s.overrides||{}),[qid]:{scores:[...f.querySelectorAll('[data-i]')].map(x=>Number(x.value)),at:new Date().toISOString()}};if(await saveStudent(s,['overrides'])){document.activeElement?.blur();teacherRender();selectedDetail=s.id;detailRender();notice('Rúbrica revisada.')}});el.querySelectorAll('[data-waive]').forEach(x=>x.onchange=async()=>{const e=(s.events||[]).find(v=>v.id===x.dataset.waive);if(!e)return;e.waived=x.checked;await saveStudent(s,['events']);teacherRender();selectedDetail=s.id;detailRender()})}
function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>notice('La pantalla completa no está disponible en este navegador.'))}}
function createRoom(){if(db.students.length&&!confirm('Vas a crear una sala nueva. La sala actual ('+roomCode+') y sus resultados se conservan en la base de datos; puedes volver con su código y PIN. ¿Continuar?'))return;teacher=null;safeSessionRemove(TSESSION);selectedDetail='';setRoom('');}
async function teacherPhase(ph){try{const {error}=await sb.rpc('set_room_phase',{p_code:roomCode,p_hash:teacher.hash,p_phase:ph});if(error)throw error;await refresh(true)}catch(e){notice(friendly(e))}}
function startRoom(){if(phase()!=='lobby'||!db.students.length)return;if(!confirm('Iniciar el plazo único de 60 minutos para toda la sala. ¿Continuar?'))return;teacherPhase('active')}
function closeRoom(){if(!confirm('Cerrar definitivamente esta evaluación para todos los equipos?'))return;teacherPhase('closed')}
function exportCSV(){const rows=[['Nombre','RUT','Equipo','Inicio','Respuestas','MC/30','Desarrollo/20','Penalizaciones','Total/50','Eventos','Respuestas desarrollo']];for(const s of db.students){const sc=scores(s);rows.push([s.name,s.rut,db.teams.find(t=>t.id===s.teamId)?.name||'',s.joinedAt,answerCount(s),sc.mc,sc.op,sc.penalties,sc.total,(s.events||[]).map(e=>`${e.at} ${e.kind} ${e.reason}${e.waived?' [anulada]':''}`).join(' | '),QUESTIONS.open.map(q=>JSON.stringify(s.answers[q.id]?.fields||{})).join(' | ')])}const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='MarchaRally_'+roomCode+'_Resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}
document.addEventListener('visibilitychange',()=>{if(view==='student'){if(document.hidden)event('salida','Pestaña oculta / cambio de aplicación');else{event('entrada','Regreso a la pestaña');refresh(false)}}});
window.addEventListener('pagehide',()=>{if(view==='student')event('salida','Navegación o cierre del navegador')});
let wasFull=false;document.addEventListener('fullscreenchange',()=>{if(view==='student'&&wasFull&&!document.fullscreenElement)event('salida','Salida de pantalla completa');wasFull=!!document.fullscreenElement});
setInterval(()=>{const c=clockString();for(const id of ['clockStudent','clockWall','clockTeacher']){const el=$(id);if(el)el.textContent=c}if(view==='student'&&getMe()&&phase()==='closed')studentRender(false)},1000);
setInterval(()=>{if(document.hidden)return;refresh(false)},view==='student'?12000:8000);
// Enlaces directos: ?sala=CODIGO, #docente, #qr
(async()=>{if(!sb){netError='No se pudo cargar la conexión a la base de datos. Revisa tu internet y recarga la página.'}else{syncClock();subscribe()}if(location.hash==='#docente'){view='student';goto('teacher')}else if(location.hash==='#qr'){view='student';goto('wall')}else render(true);await refresh(true)})();
</script></body></html>
